<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A0F"/>
      <stop offset="1" stop-color="#0A1A1F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22FF88"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#22FF88" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- hex / binary rain on the right -->
  <g font-family="'Courier New', monospace" font-size="14" fill="#22FF88">
    <text x="720" y="40" opacity="0.10">0x4F 0x1A 0xC3 0x7E</text>
    <text x="760" y="70" opacity="0.18">10110010 01101001</text>
    <text x="700" y="100" opacity="0.12">0xDE 0xAD 0xBE 0xEF</text>
    <text x="800" y="130" opacity="0.08">01001110 11010001</text>
    <text x="730" y="160" opacity="0.15">0x7F 0x45 0x4C 0x46</text>
    <text x="780" y="190" opacity="0.10">11100101 00110110</text>
    <text x="710" y="220" opacity="0.18">0xFF 0x00 0xA5 0x5A</text>
    <text x="820" y="250" opacity="0.08">10010011 01011100</text>
    <text x="740" y="280" opacity="0.14">0x2F 0x62 0x69 0x6E</text>
    <text x="790" y="310" opacity="0.10">01110001 10001101</text>
    <text x="705" y="340" opacity="0.16">0x90 0x90 0x90 0x90</text>
    <text x="810" y="370" opacity="0.09">11001010 00101011</text>
  </g>

  <!-- shield with lock (right side) -->
  <g transform="translate(990 200)">
    <circle r="150" fill="#22FF88" opacity="0.05"/>
    <circle r="105" fill="none" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 8"/>
    <path d="M0 -95 L80 -62 V8 C80 58 42 90 0 108 C-42 90 -80 58 -80 8 V-62 Z"
          fill="#0A1A1F" stroke="url(#accent)" stroke-width="4"/>
    <!-- lock body -->
    <rect x="-28" y="-6" width="56" height="44" rx="6" fill="url(#accent)"/>
    <!-- lock shackle -->
    <path d="M-16 -6 V-22 a16 16 0 0 1 32 0 V-6" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
    <!-- keyhole -->
    <circle cx="0" cy="14" r="6" fill="#0A1A1F"/>
    <rect x="-2.5" y="16" width="5" height="12" rx="2" fill="#0A1A1F"/>
  </g>

  <!-- terminal window dots -->
  <circle cx="64" cy="56" r="6" fill="#F87171"/>
  <circle cx="86" cy="56" r="6" fill="#FBBF24"/>
  <circle cx="108" cy="56" r="6" fill="#22FF88"/>

  <!-- prompt line -->
  <text x="64" y="112" font-family="'Courier New', monospace" font-size="19" fill="#22FF88">root@kali:~# <tspan fill="#94A3B8">whoami</tspan></text>

  <!-- name (EDIT THIS) -->
  <text x="64" y="195" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="bold" fill="#F1F5F9">Raghav Gupta</text>

  <!-- accent underline -->
  <rect x="64" y="214" width="140" height="5" rx="2" fill="url(#accent)"/>

  <!-- role line (EDIT THIS) -->
  <text x="64" y="258" font-family="'Courier New', monospace" font-size="20" letter-spacing="1" fill="#22D3EE">Network & Cybersecurity  //  B.Tech CSE Student</text>

  <!-- tagline (EDIT THIS) -->
  <text x="64" y="300" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#CBD5E1">Learning to break systems so I can defend them.</text>

  <!-- skill chips (EDIT THESE) -->
  <g font-family="'Courier New', monospace" font-size="15" fill="#22FF88">
    <rect x="64" y="328" width="150" height="30" rx="4" fill="none" stroke="#22FF88" stroke-opacity="0.5"/>
    <text x="78" y="348">[ network-sec ]</text>
    <rect x="228" y="328" width="150" height="30" rx="4" fill="none" stroke="#22FF88" stroke-opacity="0.5"/>
    <text x="242" y="348">[ CCNA ]</text>
    <rect x="392" y="328" width="150" height="30" rx="4" fill="none" stroke="#22FF88" stroke-opacity="0.5"/>
    <text x="406" y="348">[ blue-team ]</text>
  </g>
</svg>
